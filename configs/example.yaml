# BGFM example configuration. Keep machine-specific paths in configs/local.yaml
# (local.yaml is git-ignored) rather than editing source files.

brain_encoder:
  brainlm_code_dir: third_party/brainlm
  all_csv_dir: data/unimodal/brain/bold
  coords_csv: data/metadata/mni_coordinates.csv
  labels_csv: data/unimodal/brain/labels.csv
  pretrained_ckpt: checkpoints/brainlm_pretrained
  pipeline_out_dir: outputs/brain_encoder
  run_finetune: true
  run_feature_extraction: true
  run_analysis: true
  num_rois: 90
  window_len: 100
  patch_size: 10
  mask_ratio: 0.2
  seed: 42

brain_feature_extraction:
  brainlm_code_dir: third_party/brainlm
  new_bold_dir: data/paired/bold
  coords_csv: data/metadata/mni_coordinates.csv
  best_ckpt: checkpoints/brain_encoder_best
  out_dir: outputs/paired_brain_features
  num_rois: 90
  window_len: 100
  patch_size: 10
  seed: 42

gut_encoder:
  project_dir: third_party/mgm
  corpus_pkl: third_party/mgm/corpus.pkl
  abund_csv: data/unimodal/gut/abundance.csv
  labels_csv: data/unimodal/gut/labels.csv
  pretrained_model_dir: checkpoints/mgm_pretrained
  out_dir: outputs/gut_encoder
  n_taxa: 642
  n_bins_nonzero: 31
  seed: 42

gut_feature_extraction:
  test_abund_csv: data/paired/microbiome_abundance.csv
  feature_dir: checkpoints/gut_encoder_best
  out_path: outputs/paired_gut_features/gut_classification_features.pt
  seed: 42
  batch_size: 32
  num_workers: 2

bridge:
  brain_feat_pt: outputs/paired_brain_features/brain_classification_features.pt
  gut_feat_pt: outputs/paired_gut_features/gut_classification_features.pt
  micro_abund_csv: data/paired/microbiome_abundance.csv
  roi_mean_csv: data/paired/bold_roi_mean.csv
  out_dir: outputs/alignment
  ckpt_dir: outputs/alignment
  run_train_cv: true
  run_ext_brain2micro: false
  run_ext_micro2brain: false
  n_folds: 10
  d_align: 256
  seed: 1307

counterfactual:
  out_dir: outputs/alignment
  ckpt_dir: outputs/alignment
  brain_feat_pt: outputs/paired_brain_features/brain_classification_features.pt
  gut_feat_pt: outputs/paired_gut_features/gut_classification_features.pt
  micro_abund_csv: data/paired/microbiome_abundance.csv
  roi_mean_csv: data/paired/bold_roi_mean.csv
  group_csv: data/paired/labels_4class.csv

counterfactual_analysis:
  out_subdir: outputs/counterfactual
  roi_name_file: data/metadata/brain_roi_names.txt
  taxa_name_file: data/metadata/taxa_names.txt
  control_group: HC
  disease_groups: [MDD, SZ, BD]
  lambda_values: [0.0, 0.25, 0.5, 0.75, 1.0]
  pi_steps: 21

classification:
  true_bold_csv: data/paired/bold_roi_mean.csv
  true_micro_csv: data/paired/microbiome_abundance.csv
  oof_predbrain_csv: outputs/alignment/OOF_bold_pred.csv
  oof_predgut_csv: outputs/alignment/OOF_taxa_pred.csv
  label_csv: data/paired/labels_4class.csv
  out_dir: outputs/classification
  n_repeats: 500
  n_splits: 5
  inner_splits: 3
  n_classes: 4

subtype:
  node_representation_npz: outputs/alignment/node_representations_raw_and_normed.npz
  sample_info_csv: outputs/alignment/aligned_samples.csv
  label_csv: data/paired/labels_mdd_hc.csv
  clinical_csv: data/paired/clinical_biomarkers.csv
  roi_name_file: data/metadata/brain_roi_names.txt
  taxa_name_file: data/metadata/taxa_names.txt
  out_dir: outputs/subtype
  n_rois: 90
  n_taxa: 642
  seed: 42
